<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create Account</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <form class="card" action="#" method="post">
    <header class="card-header">
      <h1>Create Account</h1>
    </header>

    <div class="card-body">
      <div class="field">
        <label for="first">First name *</label>
        <input type="text" id="first" name="first" placeholder="enter your first name" required>
      </div>
      <div class="field">
        <label for="last">Last name</label>
        <input type="text" id="last" name="last" placeholder="enter your last name">
      </div>

      <div class="field full">
        <label for="email">Email*</label>
        <input type="email" id="email" name="email" placeholder="enter your email" required>
      </div>

      <div class="field">
        <label for="pw">Password *</label>
        <input type="password" id="pw" name="pw" placeholder="enter your password" required>
      </div>
      <div class="field">
        <label for="pw2">Confirm Password *</label>
        <input type="password" id="pw2" name="pw2" placeholder="enter your password again" required>
      </div>

      <div class="field">
        <span class="label">Gender:</span>
        <div class="choices">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </div>
      <div class="field">
        <span class="label">Hobbies</span>
        <div class="choices">
          <label><input type="checkbox" name="hobby" value="music"> Music</label>
          <label><input type="checkbox" name="hobby" value="sports"> Sports</label>
          <label><input type="checkbox" name="hobby" value="travel"> Travel</label>
          <label><input type="checkbox" name="hobby" value="movies"> Movies</label>
        </div>
      </div>

      <div class="field">
        <label for="source">Source of Income</label>
        <select id="source" name="source">
          <option>Employed</option>
          <option>Self-employed</option>
          <option>Student</option>
          <option>Unemployed</option>
          <option>Retired</option>
        </select>
      </div>
      <div class="field">
        <label for="income">Income</label>
        <div class="range-row">
          <input type="range" id="income" name="income" min="20000" max="200000" step="5000" value="20000">
          <output id="income-out" for="income">20K</output>
        </div>
      </div>

      <div class="field">
        <label for="photo">Upload Profile Picture</label>
        <input type="file" id="photo" name="photo" accept="image/*">
      </div>
      <div class="field">
        <label for="age">Age</label>
        <input type="number" id="age" name="age" value="18" min="0" max="120">
      </div>

      <div class="field full">
        <label for="bio">Bio</label>
        <textarea id="bio" name="bio" rows="5"></textarea>
      </div>
    </div>

    <footer class="card-footer">
      <input type="submit" value="Create">
    </footer>
  </form>

  <script>
    const income = document.getElementById('income');
    const out = document.getElementById('income-out');
    function update() { out.textContent = Math.round(income.value / 1000) + 'K'; }
    income.addEventListener('input', update);
    update();
  </script>
</body>
</html>
