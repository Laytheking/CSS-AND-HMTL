<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Shop Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="dashboard">
    <header class="header">
      <h1>Coffee Shop Dashboard</h1>
      <p>Wednesday, 11 November</p>
    </header>

    <nav class="sidebar">
      <a href="#">Home</a>
      <a href="#">Orders</a>
      <a href="#">Menu</a>
      <a href="#">Customers</a>
      <a href="#">Settings</a>
    </nav>

    <main class="main">

      <section class="stats">
        <div class="card">
          <h3>Sales today</h3>
          <p class="big">$1,240</p>
        </div>
        <div class="card">
          <h3>Orders</h3>
          <p class="big">86</p>
        </div>
        <div class="card">
          <h3>Customers</h3>
          <p class="big">64</p>
        </div>
        <div class="card">
          <h3>Rating</h3>
          <p class="big">4.8</p>
        </div>
      </section>

      <section class="card chart">
        <h3>Orders this week</h3>
        <div class="bars">
          <div style="height: 50%">Mon</div>
          <div style="height: 70%">Tue</div>
          <div style="height: 60%">Wed</div>
          <div style="height: 85%">Thu</div>
          <div style="height: 100%">Fri</div>
          <div style="height: 90%">Sat</div>
          <div style="height: 40%">Sun</div>
        </div>
      </section>

      <section class="card orders">
        <h3>Latest orders</h3>
        <ul>
          <li>Latte – Dara</li>
          <li>Espresso – Mina</li>
          <li>Cappuccino – Sokha</li>
          <li>Iced coffee – Vanna</li>
        </ul>
      </section>

    </main>
  </div>

</body>
</html>
