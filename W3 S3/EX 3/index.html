<!DOCTYPE html>
<html>
  <head>
    <title>Flexbox Pricing Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Sono", sans-serif;
      }
      
      .pricing-container{
        background-color: rgb(188, 172, 172);
        display: flex;
        justify-content: center;
        padding: 10px;
        gap:20px;
      }

      .pricing-plan{
        width: 200px;
        border-radius: 10px;
        background-color: white;
        display: flex; 
        flex-direction: column;
        gap: 20px;
      }

      .plan-title{
        display: flex;
        justify-content: center;
        width: 180px;
        border-radius: 10px 10px 0px 0px;
        padding: 10px;
        color: white;
      }

      #Basic .plan-title{
        background-color: rgb(80, 176, 164);
      }

      #Standard .plan-title{
        background-color: rgba(68, 87, 214, 0.825);
      }

      #Premium .plan-title{
        background-color: rgb(183, 0, 255);
      }

      #Basic button{
        background-color: rgb(80, 176, 164);
      }

      #Standard button{
        background-color: rgba(68, 87, 214, 0.825);
      }

      #Premium button{
        background-color: rgb(183, 0, 255);
      }

      .plan-price{
        font-size: larger;
        margin-top: auto;
        display: flex;
        justify-content: center;
      }

      .plan-button{
        margin-top: auto;
        margin-bottom: 15px;
        align-self: center;
        color: rgb(252, 249, 249);
        border: none;
        border-radius: 15px;
        width: 100px;
        padding: 5px;
        cursor: pointer;
      }

      #Basic button:hover,#Standard button:hover,#Premium button:hover{
        background-color: rgb(19, 221, 53);
        transition: 2s;
      }

      .plan-features{
        display: flex;
        flex-direction: column;
        gap: 10px;
        font-size: small;
      }

      .plan-features li{
        list-style: none;
      }

      /* Hint: What can you do with a media query and flexbox? */
      @media (max-width: 1250px) {
        .pricing-container{
          flex-direction: column;
          align-items: center;
        }
      }
    </style>
  </head>

  <body>
    <div class="pricing-container">
      <div class="pricing-plan" id="Basic">
        <div class="plan-title" >Basic</div>
        <div class="plan-price">$9.99/month</div>
        <ul class="plan-features">
          <li>✅ 10GB Storage</li>
          <li>✅ 1 User</li>
          <li>🚫 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan" id="Standard">
        <div class="plan-title" >Standard</div>
        <div class="plan-price">$19.99/month</div>
        <ul class="plan-features">
          <li>✅ 50GB Storage</li>
          <li>✅ 5 Users</li>
          <li>✅ Phone &amp; Email Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
      <div class="pricing-plan" id="Premium">
        <div class="plan-title" >Premium</div>
        <div class="plan-price">$49.99/month</div>
        <ul class="plan-features">
          <li>✅ 100GB Storage</li>
          <li>✅ 10 Users</li>
          <li>✅ 24/7 Support</li>
        </ul>
        <button class="plan-button">Sign Up</button>
      </div>
    </div>
  </body>
</html>
